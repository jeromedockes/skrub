<script>
 // Follow links within the report with location.replace() so that moving
 // between node pages does not add entries to the browser's back-button
 // history: pressing Back returns to the page from which the report was
 // opened, rather than stepping through the report pages that were visited.
 // The graph itself is in index.html and its links target this iframe; it
 // sends us a message asking us to navigate (see data_ops-report.js).
 (function () {
     const here = new URL(window.location.href);
     const reportDir = here.pathname.slice(
         0, here.pathname.lastIndexOf("/") + 1);
     function navigate(url) {
         const target = new URL(url, here);
         const isReportPage = (
             target.protocol === here.protocol &&
             target.host === here.host &&
             target.pathname.startsWith(reportDir));
         if (isReportPage) {
             window.location.replace(target.href);
         }
         return isReportPage;
     }
     document.addEventListener("click", (event) => {
         if (event.defaultPrevented || event.button !== 0 ||
             event.metaKey || event.ctrlKey || event.shiftKey ||
             event.altKey || !(event.target instanceof Element)) {
             return;
         }
         const link = event.target.closest("a");
         if (!link) {
             return;
         }
         const target = link.getAttribute("target");
         const href = link.getAttribute("href") ||
             link.getAttributeNS("http://www.w3.org/1999/xlink", "href");
         if ((target && target !== "_self") || !href ||
             link.hasAttribute("download")) {
             return;
         }
         if (navigate(href)) {
             event.preventDefault();
         }
     });
     window.addEventListener("message", (event) => {
         if (event.source !== window.parent) {
             return;
         }
         if (!event.data || event.data.type !== "skrub-report-navigate") {
             return;
         }
         navigate(event.data.url);
     });
 })();
</script>
